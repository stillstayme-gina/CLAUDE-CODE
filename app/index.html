<title>주말아이길</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 스티커북 느낌의 한 열 모바일 앱. 하늘 배경 → 헤더(해·구름) → 나이 → 서울 지도 → 탭(추천/만들기/장소) → 스티커 카드 */
:root{
  --bg:#E6F4FF; --paper:#FFFFFF; --ink:#22314D; --muted:#5C6B85; --shadow:#22314D;
  --sun:#FFC83D; --tomato:#FF6B57; --grass:#33B36B; --sky:#3A9BEF; --grape:#9B7BE8; --peach:#FFD9C7;
  --sun-soft:#FFF1C7; --grass-soft:#D8F3E3; --sky-soft:#D6EBFF; --tomato-soft:#FFE0DA; --grape-soft:#EAE2FF;
  --river:#7CC4F7;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --hand:"Gaegu","Jua",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13203A; --paper:#1D2B48; --ink:#EEF3FF; --muted:#A9B6D3; --shadow:#0A1224;
  --sun:#FFCF57; --tomato:#FF8A78; --grass:#57CC8A; --sky:#6DB6F5; --grape:#B49CF0; --peach:#5A3B33;
  --sun-soft:#3D3720; --grass-soft:#1C3A2E; --sky-soft:#1D3456; --tomato-soft:#47292A; --grape-soft:#2F2850;
  --river:#2F6EA8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13203A; --paper:#1D2B48; --ink:#EEF3FF; --muted:#A9B6D3; --shadow:#0A1224;
  --sun:#FFCF57; --tomato:#FF8A78; --grass:#57CC8A; --sky:#6DB6F5; --grape:#B49CF0; --peach:#5A3B33;
  --sun-soft:#3D3720; --grass-soft:#1C3A2E; --sky-soft:#1D3456; --tomato-soft:#47292A; --grape-soft:#2F2850;
  --river:#2F6EA8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--sky) 22%,transparent) 1.5px, transparent 0);background-size:22px 22px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 56px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px dashed var(--tomato);outline-offset:3px}

/* 헤더 */
.hero{position:relative;background:var(--sun);border:3px solid var(--ink);border-radius:28px;box-shadow:5px 5px 0 var(--shadow);padding:20px 20px 18px;overflow:hidden}
.hero svg{position:absolute;right:-6px;top:-6px;width:130px;height:auto}
.hero h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;margin:0;color:#22314D;position:relative}
.hero p{font-family:var(--hand);font-size:19px;margin:8px 0 0;color:#22314D;position:relative;max-width:calc(100% - 100px);line-height:1.25}

.sec-title{font-family:var(--display);font-size:20px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec-title .dot{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink);background:var(--grass)}

/* 나이 스티커 */
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.age{border:3px solid var(--ink);border-radius:20px;background:var(--paper);padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:3px 3px 0 var(--shadow);transition:transform .12s}
.age .face{font-size:30px;line-height:1}
.age b{font-family:var(--display);font-weight:400;font-size:17px}
.age small{font-family:var(--hand);font-size:15px;color:var(--muted)}
.age[aria-pressed="true"]{background:var(--c);transform:translate(-2px,-2px) rotate(-2deg);box-shadow:5px 5px 0 var(--shadow)}
.age[aria-pressed="true"] small,.age[aria-pressed="true"] b{color:#22314D}

/* 지도 */
.mapbox{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:4px 4px 0 var(--shadow);padding:10px}
.mapbox svg{width:100%;height:auto;display:block}
.zone{cursor:pointer}
.zone path{stroke:var(--ink);stroke-width:2.5;transition:transform .15s}
.zone text{font-family:var(--display);font-size:15px;fill:#22314D;pointer-events:none}
.zone .cnt{font-family:var(--hand);font-size:13px}
.zone[aria-pressed="true"] path{stroke-width:5}
.zone:focus-visible path{stroke:var(--tomato);stroke-dasharray:6 4}
.river{fill:none;stroke:var(--river);stroke-width:14;stroke-linecap:round}
.regions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rchip{border:2.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 13px;cursor:pointer;font-family:var(--display);font-size:15px}
.rchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* 탭 */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{border:3px solid var(--ink);border-radius:16px;background:var(--paper);padding:10px 4px;cursor:pointer;font-family:var(--display);font-size:16px}
.tab[aria-selected="true"]{background:var(--tomato);color:#fff;box-shadow:3px 3px 0 var(--shadow)}
.rain{display:flex;align-items:center;gap:8px;font-family:var(--hand);font-size:19px;cursor:pointer;width:max-content}
.rain input{width:22px;height:22px;accent-color:var(--sky)}

/* 카드 */
.list{display:flex;flex-direction:column;gap:18px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
.card:nth-child(4n+1){--tone:var(--sun-soft)} .card:nth-child(4n+2){--tone:var(--grass-soft)}
.card:nth-child(4n+3){--tone:var(--sky-soft)} .card:nth-child(4n){--tone:var(--grape-soft)}
.card-top{display:flex;gap:12px;align-items:center}
.badge{flex:none;width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);background:var(--tone,var(--sun-soft));display:grid;place-items:center;font-size:28px;transform:rotate(-6deg)}
.card h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.25;text-wrap:balance}
.card .sub{font-family:var(--hand);font-size:17px;color:var(--muted);margin:0;line-height:1.2}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:3px 9px;border-radius:999px;border:2px solid var(--ink);background:var(--paper)}
.tag.in{background:var(--sky-soft)} .tag.out{background:var(--grass-soft)} .tag.free{background:var(--sun-soft)} .tag.book{background:var(--tomato-soft)}
.steps{list-style:none;margin:0;padding:0 0 0 6px;display:flex;flex-direction:column;position:relative}
.steps::before{content:"";position:absolute;left:31px;top:14px;bottom:14px;border-left:3px dotted var(--muted)}
.steps li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:6px 0;position:relative;align-items:start}
.time{font-family:var(--hand);font-size:16px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;text-align:center;font-variant-numeric:tabular-nums;position:relative;z-index:1;line-height:1.5}
.steps b{font-weight:700;font-size:15.5px}
.steps small{display:block;color:var(--muted);font-size:13px}
.meal{background:var(--peach);border:2.5px dashed var(--ink);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:9px}
.meal-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.meal-head b{font-family:var(--display);font-weight:400;font-size:17px}
.pills{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.pill{padding:2px 9px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);white-space:nowrap}
.pill.yes{background:var(--grass);color:#fff} .pill.no{background:var(--tomato);color:#fff}
.vote{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2.5px solid var(--ink);background:var(--paper);padding:6px 12px;border-radius:14px;cursor:pointer;font-family:var(--display);font-size:14.5px;box-shadow:2px 2px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.on-yes{background:var(--grass);color:#fff} .btn.on-no{background:var(--tomato);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{font-size:16px;padding:9px 14px}
a.link{color:var(--sky);font-family:var(--display);font-size:14px;text-decoration:none;border-bottom:2px solid currentColor}
.note{font-size:12.5px;color:var(--muted);margin:0}
.empty{font-family:var(--hand);font-size:20px;color:var(--muted);text-align:center;padding:20px 8px;border:3px dashed var(--muted);border-radius:22px}

/* 코스 만들기 */
.builder{background:var(--sun-soft);border:3px solid var(--ink);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:5px 5px 0 var(--shadow)}
.builder h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:10px;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:8px 10px}
.slot .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tomato);color:#fff;display:grid;place-items:center;font-family:var(--display)}
.slot .t{flex:1;min-width:0}
.slot .t b{display:block}
.slot .t small{color:var(--muted);font-size:12.5px}
.x{border:2px solid var(--ink);background:var(--paper);border-radius:10px;width:32px;height:32px;cursor:pointer;font-family:var(--display)}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{border:2.5px solid var(--ink);border-radius:18px;background:var(--paper);padding:10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;min-width:0;box-shadow:3px 3px 0 var(--shadow)}
.pcard .em{font-size:26px;line-height:1}
.pcard b{font-family:var(--display);font-weight:400;font-size:15.5px;line-height:1.25}
.pcard small{color:var(--muted);font-size:12px}
.pcard[aria-pressed="true"]{background:var(--grass-soft);box-shadow:none;transform:translate(2px,2px)}
.pcard[aria-pressed="true"] .em::after{content:" ✔"; font-size:18px;color:var(--grass)}
footer{font-size:12.5px;color:var(--muted);text-align:center;padding:4px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="hero">
    <svg viewBox="0 0 140 120" aria-hidden="true">
      <g stroke="#22314D" stroke-width="3" stroke-linecap="round">
        <line x1="95" y1="8" x2="95" y2="20"/><line x1="95" y1="70" x2="95" y2="82"/>
        <line x1="58" y1="45" x2="70" y2="45"/><line x1="120" y1="45" x2="132" y2="45"/>
        <line x1="69" y1="19" x2="77" y2="27"/><line x1="113" y1="63" x2="121" y2="71"/>
        <line x1="121" y1="19" x2="113" y2="27"/><line x1="77" y1="63" x2="69" y2="71"/>
      </g>
      <circle cx="95" cy="45" r="20" fill="#FFF3B0" stroke="#22314D" stroke-width="3"/>
      <circle cx="88" cy="42" r="2.5" fill="#22314D"/><circle cx="102" cy="42" r="2.5" fill="#22314D"/>
      <path d="M87 51 q8 7 16 0" fill="none" stroke="#22314D" stroke-width="3" stroke-linecap="round"/>
      <path d="M40 104 q-14 0 -12 -12 q2 -10 13 -8 q4 -12 18 -9 q12 2 11 14 q10 0 9 9 q-1 7 -10 6 z" fill="#fff" stroke="#22314D" stroke-width="3"/>
    </svg>
    <h1>주말아이길</h1>
    <p>이번 주말엔 어디 갈까?<br>아이랑 걷는 서울 하루</p>
  </header>

  <section>
    <h2 class="sec-title"><span class="dot"></span>우리 아이는 몇 살?</h2>
    <div class="ages" id="ages" role="group" aria-label="아이 나이"></div>
  </section>

  <section>
    <h2 class="sec-title"><span class="dot" style="background:var(--sky)"></span>어느 동네로 갈까?</h2>
    <div class="mapbox">
      <svg viewBox="0 0 340 240" id="map" role="group" aria-label="서울 지역 선택"></svg>
      <div class="regions" id="regions"></div>
    </div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-routes">추천 코스</button>
    <button class="tab" role="tab" id="tab-build">코스 만들기</button>
    <button class="tab" role="tab" id="tab-places">장소 보기</button>
  </div>
  <label class="rain"><input type="checkbox" id="indoor"> ☔ 비 오는 날이라 실내만</label>

  <div class="list" id="list"></div>

  <footer>식당 평점과 유아의자는 아직 확인 전이에요. 다녀온 분이 "유아의자 있어요/없어요"를 눌러주면 다른 부모님께도 바로 보여요.<br>운영시간·예약은 각 장소 공식 사이트에서 꼭 확인하세요.</footer>
</div>

  const top=el("div","card-top");top.append(el("div","badge",p.e));
  const tt=el("div");tt.append(el("h2",null,p.n));
  const a=el("a","link","지도 ↗");a.href=naver(p.n);a.target="_blank";a.rel="noopener";tt.append(a);
  top.append(tt);c.append(top,tags(p));
  const add=el("button","btn",S.my.includes(id)?"✔ 내 코스에 담김":"＋ 내 코스에 담기");
  add.onclick=()=>toggleMy(id);c.append(add);return c;
}
function toggleMy(id){
  const i=S.my.indexOf(id);
  if(i>=0)S.my.splice(i,1);else{if(S.my.length>=3)S.my.shift();S.my.push(id)}
  save();renderAll();
}
function builder(list){
  const b=el("section","builder");
  b.append(el("h3",null,"🧩 우리 가족 코스 만들기"));
  b.append(el("p","note","지도에서 동네를 고르고, 아래에서 가고 싶은 곳을 최대 3곳까지 눌러 담으세요. 점심은 첫 장소 근처 식당으로 자동으로 넣어줘요."));
  const slots=el("div","slots");
  if(!S.my.length)slots.append(el("div","empty","아직 담은 곳이 없어요 🎈"));
  const times=["10:00","13:30","15:30"];
  S.my.forEach((id,i)=>{const p=P[id];const s=el("div","slot");
    s.append(el("span","n",String(i+1)));const t=el("div","t");t.append(el("b",null,p.e+" "+p.n));
    t.append(el("small",null,times[i]+" · "+regionLabel(p.r)+" "+p.gu+(fitAge(p)?"":" · ⚠️ 나이에 안 맞을 수 있어요")));s.append(t);
    const up=el("button","x","↑");up.setAttribute("aria-label","앞으로");up.disabled=i===0;
    up.onclick=()=>{[S.my[i-1],S.my[i]]=[S.my[i],S.my[i-1]];save();renderAll()};
    const x=el("button","x","✕");x.setAttribute("aria-label","빼기");x.onclick=()=>toggleMy(id);
    s.append(up,x);slots.append(s);
    if(i===0){const ms=Object.keys(M).filter(k=>M[k].r===p.r);
      const lunch=el("div","slot");lunch.append(el("span","n","🍚"));const lt=el("div","t");
      lt.append(el("b",null,"12:00 점심"));lt.append(el("small",null,"아래 "+regionLabel(p.r)+" 식당 후보 중에서 골라요"));lunch.append(lt);slots.append(lunch);}
  });
  b.append(slots);
  if(S.my.length){
    const regs=new Set(S.my.map(id=>P[id].r));
    if(regs.size>1)b.append(el("p","note","⚠️ 서로 다른 권역이 섞여 있어요. 이동 시간이 길어질 수 있어요."));
    const clr=el("button","btn","🧹 다 비우기");clr.onclick=()=>{S.my=[];save();renderAll()};b.append(clr);
  }
  list.append(b);
  if(S.my.length){const r=P[S.my[0]].r;Object.keys(M).filter(k=>M[k].r===r).forEach(k=>list.append(mealBox(k)));}
  const head=el("h2","sec-title");head.innerHTML='<span class="dot" style="background:var(--tomato)"></span>';
  head.append((S.region==="all"?"전체":regionLabel(S.region))+"에서 담을 곳");list.append(head);
  const ids=Object.keys(P).filter(id=>{const p=P[id];return inRegion(p.r)&&fitAge(p)&&(!S.indoor||p.in)});
  const grid=el("div","pick");
  ids.forEach(id=>{const p=P[id];const c=el("button","pcard");c.setAttribute("aria-pressed",String(S.my.includes(id)));
    c.append(el("span","em",p.e),el("b",null,p.n),el("small",null,(p.in?"실내":"야외")+" · "+p.gu));c.onclick=()=>toggleMy(id);grid.append(c)});
  if(!ids.length)list.append(el("div","empty","이 조건에 맞는 장소가 없어요"));else list.append(grid);
}
function renderList(){
  ["routes","build","places"].forEach(t=>$("#tab-"+t).setAttribute("aria-selected",String(S.tab===t)));
  $("#indoor").checked=S.indoor;
  const list=$("#list");list.textContent="";
  if(S.tab==="routes"){
    const rs=R.filter(r=>inRegion(r.r)&&r.a.includes(S.age)&&(!S.indoor||r.s.every(s=>!P[s[1]]||P[s[1]].in)));
    rs.forEach(r=>list.append(routeCard(r)));
    if(!rs.length)list.append(el("div","empty","이 동네엔 맞는 코스가 아직 없어요. 다른 동네를 골라보거나 '코스 만들기'로 직접 짜 보세요!"));
  }else if(S.tab==="build")builder(list);
  else{
    const ids=Object.keys(P).filter(id=>{const p=P[id];return inRegion(p.r)&&fitAge(p)&&(!S.indoor||p.in)});
    ids.forEach(id=>list.append(placeCard(id)));
    if(!ids.length)list.append(el("div","empty","이 조건에 맞는 장소가 없어요"));
  }
}
function renderAll(){renderAges();renderMap();renderList()}
$("#tab-routes").onclick=()=>set("tab","routes");
$("#tab-build").onclick=()=>set("tab","build");
$("#tab-places").onclick=()=>set("tab","places");
$("#indoor").onchange=e=>set("indoor",e.target.checked);

async function vote(mid,has){
  if(!db||!myId)return;
  const ref=db.collection("highchair").doc(mid+"__"+myId);
  try{if(myVotes[mid]===has)await ref.delete();else await ref.set({mealId:mid,has,at:new Date().toISOString()})}catch(e){console.warn(e)}
}
(async()=>{
  if(!window.claude||!claude.use)return;
  try{
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u)return;myId=await u.id();if(!myId)return;db=d;renderList();
    db.collection("highchair").onSnapshot(snap=>{
      const v={},mine={};
      snap.docs.forEach(doc=>{const x=doc.data()||{};if(!M[x.mealId])return;
        (v[x.mealId]=v[x.mealId]||{yes:0,no:0})[x.has?"yes":"no"]++;
        if(doc.id.endsWith("__"+myId))mine[x.mealId]=!!x.has});
      votes=v;myVotes=mine;renderList();
    },e=>console.warn(e));
  }catch(e){console.warn(e)}
})();
renderAll();
</script>
